[project]
name = "khmersub"
version = "0.1.0"
description = "Word-by-word Khmer subtitles: extract audio from video and generate SRT cues with the Gemini API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "khmercut>=0.1",
    "pyfiglet>=1.0",
    "questionary>=2.0",
    "requests>=2.0",
    "rich>=13.0",
]
